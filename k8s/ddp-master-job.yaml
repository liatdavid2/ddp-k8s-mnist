apiVersion: batch/v1
kind: Job
metadata:
  name: ddp-master
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: ddp
        role: master
    spec:
      restartPolicy: Never
      containers:
        - name: master
          image: ddp-mnist:0.1
          imagePullPolicy: Never

          command: ["torchrun"]

          args:
            - "--nproc_per_node=1"
            - "--nnodes=2"
            - "--node_rank=0"
            - "--rdzv_backend=c10d"
            - "--rdzv_endpoint=ddp-master-svc:29500"
            - "--rdzv_id=mnist-ddp"
            - "--master_addr=ddp-master-svc"
            - "--master_port=29500"

            - "/app/src/train.py"